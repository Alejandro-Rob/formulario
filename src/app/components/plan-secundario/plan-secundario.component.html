<div class="contenedor">
    <h2>¡Hola, {{ nombre | titlecase }}! 👋</h2>
    <p>Si se soportas hasta aquí, ¿te apetece hacer algo después?</p>

    <label *ngFor="let plan of planes" class="opcion">
        <input type="checkbox" [(ngModel)]="plan.marcado" />
        {{ plan.nombre }}
    </label>

    <button (click)="siguiente()">Siguiente</button>
</div>
